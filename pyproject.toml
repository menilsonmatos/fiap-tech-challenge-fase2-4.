[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiap-alfabetizacao-pipeline"
version = "1.0.0"
description = "Pipeline híbrido para análise da alfabetização no Brasil"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.40,<2"]
gcp = ["google-cloud-bigquery>=3.35,<4"]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1"]

[project.scripts]
alfabetizacao-pipeline = "alfabetizacao_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
